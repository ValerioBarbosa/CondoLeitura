name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Version name, for example 1.0.0
        required: false
        type: string
      build_number:
        description: Integer build number, for example 1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        shell: bash
        run: |
          args=(--release)
          if [[ -n "${{ inputs.build_name }}" ]]; then
            args+=(--build-name "${{ inputs.build_name }}")
          fi
          if [[ -n "${{ inputs.build_number }}" ]]; then
            args+=(--build-number "${{ inputs.build_number }}")
          fi
          flutter build apk "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CondoLeitura-APK-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
