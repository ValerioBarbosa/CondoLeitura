name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Versão, por exemplo 1.0.0"
        required: false
        type: string
      build_number:
        description: "Número inteiro do build, por exemplo 1"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android artifacts
        shell: bash
        run: |
          args=(--release)
          if [[ -n "${{ inputs.build_name }}" ]]; then
            args+=(--build-name "${{ inputs.build_name }}")
          fi
          if [[ -n "${{ inputs.build_number }}" ]]; then
            args+=(--build-number "${{ inputs.build_number }}")
          fi
          flutter build apk "${args[@]}"
          flutter build appbundle "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CondoLeitura-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CondoLeitura-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
