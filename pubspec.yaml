name: condoleitura
description: Aplicativo para leitura de medidores de água e gás em condomínios.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.3.1
  camera: ^0.12.0+2
  image_picker: ^1.1.2
  geolocator: ^14.0.3
  permission_handler: ^13.0.0
  google_mlkit_text_recognition: ^0.16.0
  uuid: ^4.5.1
  intl: ^0.20.1
  shared_preferences: ^2.3.4
  share_plus: ^13.3.0
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  http: ^1.2.2
  mobile_scanner: ^7.4.0

  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.1
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
